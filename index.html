<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Your Name</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .animate-fade-in {
            animation: fadeIn 0.6s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .hover-lift:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .skill-bar {
            transition: width 1s ease-in-out;
        }
        
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Portfolio = () => {
            const [activeSection, setActiveSection] = useState('home');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                    setActiveSection(id);
                    setIsMenuOpen(false);
                }
            };

            const projects = [
                {
                    title: "E-Commerce Platform",
                    description: "Full-stack online shopping platform with payment integration",
                    tech: ["React", "Node.js", "MongoDB"],
                    color: "from-blue-500 to-cyan-500"
                },
                {
                    title: "Task Management App",
                    description: "Collaborative project management tool with real-time updates",
                    tech: ["Vue.js", "Firebase", "Tailwind"],
                    color: "from-purple-500 to-pink-500"
                },
                {
                    title: "AI Chatbot",
                    description: "Intelligent conversational AI with natural language processing",
                    tech: ["Python", "TensorFlow", "FastAPI"],
                    color: "from-green-500 to-teal-500"
                },
                {
                    title: "Weather Dashboard",
                    description: "Real-time weather tracking with beautiful visualizations",
                    tech: ["React", "Chart.js", "API Integration"],
                    color: "from-orange-500 to-red-500"
                }
            ];

            const skills = [
                { name: "JavaScript", level: 90 },
                { name: "React", level: 85 },
                { name: "Python", level: 80 },
                { name: "Node.js", level: 75 },
                { name: "CSS/Tailwind", level: 88 },
                { name: "SQL", level: 70 }
            ];

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Navigation */}
                    <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-white shadow-lg' : 'bg-transparent'}`}>
                        <div className="max-w-6xl mx-auto px-4 py-4">
                            <div className="flex justify-between items-center">
                                <h1 className={`text-2xl font-bold ${scrolled ? 'text-gray-800' : 'text-white'}`}>
                                    Your Name
                                </h1>
                                
                                {/* Desktop Menu */}
                                <div className="hidden md:flex space-x-8">
                                    {['home', 'about', 'projects', 'skills', 'contact'].map((section) => (
                                        <button
                                            key={section}
                                            onClick={() => scrollToSection(section)}
                                            className={`capitalize font-medium transition-colors ${
                                                scrolled ? 'text-gray-700 hover:text-purple-600' : 'text-white hover:text-purple-300'
                                            }`}
                                        >
                                            {section}
                                        </button>
                                    ))}
                                </div>

                                {/* Mobile Menu Button */}
                                <button
                                    className="md:hidden text-white"
                                    onClick={() => setIsMenuOpen(!isMenuOpen)}
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                                    </svg>
                                </button>
                            </div>

                            {/* Mobile Menu */}
                            {isMenuOpen && (
                                <div className="md:hidden mt-4 bg-white rounded-lg shadow-lg p-4">
                                    {['home', 'about', 'projects', 'skills', 'contact'].map((section) => (
                                        <button
                                            key={section}
                                            onClick={() => scrollToSection(section)}
                                            className="block w-full text-left py-2 px-4 capitalize text-gray-700 hover:bg-purple-50 rounded"
                                        >
                                            {section}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section id="home" className="gradient-bg min-h-screen flex items-center justify-center text-white px-4">
                        <div className="text-center animate-fade-in">
                            <div className="w-32 h-32 mx-auto mb-6 bg-white rounded-full flex items-center justify-center text-6xl shadow-2xl">
                                👨‍💻
                            </div>
                            <h2 className="text-5xl md:text-7xl font-bold mb-4">Hello, I'm Your Name</h2>
                            <p className="text-xl md:text-2xl mb-8 text-purple-100">Full Stack Developer & Creative Problem Solver</p>
                            <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                <button
                                    onClick={() => scrollToSection('projects')}
                                    className="px-8 py-3 bg-white text-purple-600 rounded-full font-semibold hover:bg-purple-50 transition-all transform hover:scale-105"
                                >
                                    View My Work
                                </button>
                                <button
                                    onClick={() => scrollToSection('contact')}
                                    className="px-8 py-3 glass-effect rounded-full font-semibold hover:bg-white hover:bg-opacity-20 transition-all transform hover:scale-105"
                                >
                                    Get In Touch
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* About Section */}
                    <section id="about" className="py-20 px-4 bg-white">
                        <div className="max-w-4xl mx-auto">
                            <h2 className="text-4xl font-bold text-center mb-12 text-gray-800">About Me</h2>
                            <div className="bg-gradient-to-r from-purple-50 to-pink-50 rounded-2xl p-8 shadow-lg">
                                <p className="text-lg text-gray-700 leading-relaxed mb-6">
                                    I'm a passionate developer with a love for creating elegant solutions to complex problems. 
                                    With expertise in modern web technologies, I build responsive and user-friendly applications 
                                    that make a difference.
                                </p>
                                <p className="text-lg text-gray-700 leading-relaxed">
                                    When I'm not coding, you can find me exploring new technologies, contributing to open-source 
                                    projects, or enjoying outdoor adventures. I believe in continuous learning and staying up-to-date 
                                    with the latest industry trends.
                                </p>
                            </div>
                        </div>
                    </section>

                    {/* Projects Section */}
                    <section id="projects" className="py-20 px-4 bg-gray-50">
                        <div className="max-w-6xl mx-auto">
                            <h2 className="text-4xl font-bold text-center mb-12 text-gray-800">Featured Projects</h2>
                            <div className="grid md:grid-cols-2 gap-8">
                                {projects.map((project, index) => (
                                    <div
                                        key={index}
                                        className="bg-white rounded-2xl overflow-hidden shadow-lg hover-lift"
                                    >
                                        <div className={`h-48 bg-gradient-to-r ${project.color} flex items-center justify-center text-white text-6xl`}>
                                            🚀
                                        </div>
                                        <div className="p-6">
                                            <h3 className="text-2xl font-bold mb-3 text-gray-800">{project.title}</h3>
                                            <p className="text-gray-600 mb-4">{project.description}</p>
                                            <div className="flex flex-wrap gap-2">
                                                {project.tech.map((tech, i) => (
                                                    <span
                                                        key={i}
                                                        className="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm font-medium"
                                                    >
                                                        {tech}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Skills Section */}
                    <section id="skills" className="py-20 px-4 bg-white">
                        <div className="max-w-4xl mx-auto">
                            <h2 className="text-4xl font-bold text-center mb-12 text-gray-800">Skills & Expertise</h2>
                            <div className="space-y-6">
                                {skills.map((skill, index) => (
                                    <div key={index} className="animate-fade-in">
                                        <div className="flex justify-between mb-2">
                                            <span className="text-lg font-semibold text-gray-700">{skill.name}</span>
                                            <span className="text-lg font-semibold text-purple-600">{skill.level}%</span>
                                        </div>
                                        <div className="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                                            <div
                                                className="skill-bar h-full bg-gradient-to-r from-purple-500 to-pink-500 rounded-full"
                                                style={{ width: `${skill.level}%` }}
                                            ></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Contact Section */}
                    <section id="contact" className="py-20 px-4 gradient-bg text-white">
                        <div className="max-w-4xl mx-auto text-center">
                            <h2 className="text-4xl font-bold mb-8">Let's Work Together</h2>
                            <p className="text-xl mb-12 text-purple-100">
                                Have a project in mind? I'd love to hear from you!
                            </p>
                            <div className="flex flex-col sm:flex-row gap-6 justify-center mb-12">
                                <a
                                    href="mailto:your.email@example.com"
                                    className="px-8 py-4 bg-white text-purple-600 rounded-full font-semibold hover:bg-purple-50 transition-all transform hover:scale-105 flex items-center justify-center gap-2"
                                >
                                    <span>📧</span>
                                    Email Me
                                </a>
                                <a
                                    href="https://linkedin.com/in/yourprofile"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-8 py-4 glass-effect rounded-full font-semibold hover:bg-white hover:bg-opacity-20 transition-all transform hover:scale-105 flex items-center justify-center gap-2"
                                >
                                    <span>💼</span>
                                    LinkedIn
                                </a>
                                <a
                                    href="https://github.com/yourusername"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-8 py-4 glass-effect rounded-full font-semibold hover:bg-white hover:bg-opacity-20 transition-all transform hover:scale-105 flex items-center justify-center gap-2"
                                >
                                    <span>💻</span>
                                    GitHub
                                </a>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-gray-900 text-white py-8 text-center">
                        <p className="text-gray-400">
                            © 2026 Your Name. Built with React & Tailwind CSS
                        </p>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<Portfolio />, document.getElementById('root'));
    </script>
</body>
</html>
